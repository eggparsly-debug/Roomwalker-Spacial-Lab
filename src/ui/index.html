<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomwalker Spatial Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an architect's cyanotype drawing sheet. The room is drawn, tracks are inked on top. */
:root {
  --paper: #10294c; --paper-deep: #0b1e3a; --panel: #153359; --panel-up: #1c3f6c;
  --line: #41699b; --chalk: #e9f1f8; --dim: #a5bdd8; --accent: #f4b860; --danger: #ff8d7a;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper-deep); color: var(--chalk); font: 14px/1.3 var(--body); display: flex; flex-direction: column; min-height: 640px; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel-up); border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; cursor: pointer; min-height: 28px; }
button:hover { border-color: var(--chalk); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.on { background: var(--accent); border-color: var(--accent); color: #1b1305; font-weight: 600; }
select, input[type=number], textarea { background: var(--paper-deep); border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; min-height: 28px; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 20px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 7px 12px; background: var(--paper); border-bottom: 1px solid var(--line); }
.mark { font: 500 15px var(--mono); letter-spacing: .2em; text-transform: uppercase; }
.group { display: flex; align-items: center; gap: 5px; }
.group > label, .cap { color: var(--dim); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
#clock { font: 500 17px var(--mono); min-width: 76px; text-align: center; font-variant-numeric: tabular-nums; }
#bpm { width: 62px; font-family: var(--mono); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
.seg button:last-child { border-radius: 0 3px 3px 0; }
.push { margin-left: auto; }
#cpu { font: 12px var(--mono); color: var(--dim); min-width: 62px; text-align: right; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr) 272px; }
aside { background: var(--panel); overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
.head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 4px; }
.head button { white-space: nowrap; flex: none; }
.track { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; margin: 4px 8px; padding: 7px 8px; border: 1px solid var(--line); border-left: 4px solid var(--ink); border-radius: 3px; background: var(--paper); cursor: pointer; }
.track.sel { background: var(--panel-up); border-color: var(--chalk); border-left-color: var(--ink); }
.track .row { display: flex; align-items: center; gap: 4px; }
.track input.name { flex: 1 1 0; width: 0; background: transparent; border: 0; font-weight: 600; min-width: 0; padding: 2px; }
.mini { flex: none; }
.track select { width: 100%; }
.mini { min-height: 24px; width: 26px; padding: 0; font: 500 12px var(--mono); }
.meter { height: 4px; background: var(--paper-deep); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ink); }
#center { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; background: var(--paper); }
#views { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); min-height: 0; }
.view { position: relative; min-width: 0; min-height: 0; }
.view + .view { border-left: 1px solid var(--line); }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.tag { position: absolute; left: 10px; top: 7px; font: 500 12px var(--mono); letter-spacing: .12em; color: var(--dim); pointer-events: none; }
#hint { padding: 5px 12px; color: var(--dim); font-size: 13px; border-top: 1px solid var(--line); min-height: 28px; }
#timelineWrap { border-top: 1px solid var(--line); background: var(--paper-deep); position: relative; }
#timeline { display: block; width: 100%; touch-action: none; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: var(--paper); min-height: 36px; font-weight: 600; }
.tabs button.on { background: var(--panel); color: var(--accent); border-bottom-color: var(--accent); }
.sec { padding: 8px 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 7px; }
.sec h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.ctl { display: grid; gap: 1px; }
.ctl .top { display: flex; justify-content: space-between; gap: 8px; }
.ctl output { font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.field { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 6px; }
.xyz { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.xyz label { display: grid; gap: 1px; color: var(--dim); font-size: 12px; }
.xyz input { width: 100%; font-family: var(--mono); font-size: 12px; }
.note { color: var(--dim); font-size: 13px; margin: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 5px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat div { display: grid; }
.stat b { font: 500 15px var(--mono); }
.stat span { font-size: 12px; color: var(--dim); }
#overlay { position: fixed; inset: 0; background: rgba(5, 14, 28, .72); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#overlay.open { display: flex; }
#sheet { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--chalk); border-radius: 4px; padding: 14px; display: grid; gap: 10px; }
#sheet h2 { margin: 0; font-size: 17px; }
#sceneText { width: 100%; height: 300px; font: 12px var(--mono); resize: vertical; }
#sceneMsg { color: var(--accent); min-height: 18px; margin: 0; }
[hidden] { display: none !important; }
.linknote { padding: 0 10px 4px; }
@media (max-width: 1060px) {
  html, body { height: auto; }
  main { grid-template-columns: 1fr; }
  aside { overflow: visible; }
  #left, #right { border: 0; border-top: 1px solid var(--line); }
  #left { order: 2; } #right { order: 3; }
  #views { height: 760px; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .view + .view { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <div class="mark">Roomwalker</div>
  <div class="group">
    <button id="rewind" title="Return to bar 1" aria-label="Return to bar 1">|&lt;</button>
    <button id="play">Play</button>
    <div id="clock" aria-live="off">1.1.00</div>
    <label for="bpm">BPM</label><input id="bpm" type="number" min="40" max="240" step="1">
  </div>
  <div class="group"><label>Output</label><div class="seg" id="output"></div></div>
  <div class="group"><label for="preset">Room</label><select id="preset"></select></div>
  <div class="group" id="masterGroup"><label for="master">Master</label><input id="master" type="range" min="0" max="1" step="0.01" value="0.8" style="width:84px"></div>
  <div class="group push">
    <span id="cpu">CPU --</span>
    <button id="undo">Undo</button>
    <button id="sceneBtn">Scene file</button>
  </div>
</header>
<main>
  <aside id="left" aria-label="Tracks"></aside>
  <section id="center">
    <div id="views">
      <div class="view"><canvas id="plan" tabindex="0" aria-label="Floor plan editor"></canvas><div class="tag">PLAN / 1 M GRID</div></div>
      <div class="view"><canvas id="persp" tabindex="0" aria-label="3D room view"></canvas><div class="tag">3D</div></div>
    </div>
    <div id="hint"></div>
    <div id="timelineWrap"><canvas id="timeline" aria-label="Path timeline"></canvas></div>
  </section>
  <aside id="right" aria-label="Inspector">
    <div class="tabs"><button id="tabTrack">Track</button><button id="tabRoom">Room</button></div>
    <div id="inspector"></div>
  </aside>
</main>
<div id="overlay"><div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">Scene file</h2>
  <p class="note">This JSON holds the room, listener, tracks and paths. The VST will read the same format. Copy it to keep a scene, or paste one here and apply it.</p>
  <textarea id="sceneText" spellcheck="false" aria-label="Scene JSON"></textarea>
  <p id="sceneMsg" role="status"></p>
  <div class="btns"><button id="sceneCopy">Copy</button><button id="sceneApply">Apply pasted scene</button><button id="sceneClose" class="push">Close</button></div>
</div></div>
<input id="file" type="file" accept="audio/*" hidden>
<script>/* Roomwalker DSP core.
   Written with no DOM or Web Audio dependencies so that it runs unchanged in an
   AudioWorklet, in Node for measurement, and maps one-to-one onto the JUCE port:
     SharedRoom   -> process-wide singleton shared by linked plugin instances
     Voice        -> one plugin instance (one track, one moving sound)
     Engine       -> stands in for the DAW: transport plus a mix of all instances */
function RoomwalkerDSP() {
  'use strict';

  const C = 343;
  const TAU = Math.PI * 2;
  const HEAD_RADIUS = 0.0875;
  const SUB = 32;            // audio-rate parameter ramps
  const CONTROL = 256;       // motion and direct-path update interval, samples
  const POOL = 34;           // tap slots per voice, including ones fading out
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const MIN_DELAY = 9;       // samples; keeps every interpolator reading written audio

  /* 12-point Kaiser-windowed sinc used for the direct path: flat treble at any fractional delay */
  const SINC_TAPS = 12, SINC_PHASES = 256, SINC = (() => {
    const bessel = x => { let s = 1, t = 1; for (let k = 1; k < 30; k++) { t *= (x / (2 * k)) ** 2; s += t; } return s; };
    const beta = 6.5, h = new Float64Array((SINC_PHASES + 1) * SINC_TAPS);
    for (let p = 0; p <= SINC_PHASES; p++) {
      const f = p / SINC_PHASES; let sum = 0;
      for (let k = 0; k < SINC_TAPS; k++) {
        const x = k - 5 - f, r = x / 6;
        const win = Math.abs(r) >= 1 ? 0 : bessel(beta * Math.sqrt(1 - r * r)) / bessel(beta);
        const v = (Math.abs(x) < 1e-9 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x)) * win;
        h[p * SINC_TAPS + k] = v; sum += v;
      }
      for (let k = 0; k < SINC_TAPS; k++) h[p * SINC_TAPS + k] /= sum;
    }
    return h;
  })();

  /* Absorption coefficients: low (<300 Hz), mid, high (>2.5 kHz) */
  const MATERIALS = {
    concrete: { name: 'Concrete', a: [0.02, 0.03, 0.05] },
    brick: { name: 'Brick', a: [0.03, 0.04, 0.07] },
    stone: { name: 'Dressed stone', a: [0.02, 0.03, 0.04] },
    rock: { name: 'Rough rock', a: [0.05, 0.08, 0.14] },
    tile: { name: 'Glazed tile', a: [0.01, 0.015, 0.02] },
    glass: { name: 'Window glass', a: [0.2, 0.05, 0.03] },
    plaster: { name: 'Plaster', a: [0.12, 0.06, 0.04] },
    drywall: { name: 'Drywall', a: [0.2, 0.06, 0.05] },
    wood: { name: 'Wood panel', a: [0.2, 0.1, 0.08] },
    hardwood: { name: 'Hardwood floor', a: [0.12, 0.08, 0.08] },
    carpet: { name: 'Carpet', a: [0.08, 0.35, 0.6] },
    curtain: { name: 'Heavy curtain', a: [0.1, 0.5, 0.65] },
    foam: { name: 'Acoustic foam', a: [0.2, 0.75, 0.95] }
  };
  const AIR = [0.0001, 0.0006, 0.0045];
  const matOf = id => MATERIALS[id] || MATERIALS.plaster;

  /* ------------------------------------------------------------------ geometry */
  function signedArea(v) {
    let s = 0;
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length];
      s += a.x * b.y - b.x * a.y;
    }
    return s / 2;
  }
  function pointInPoly(x, y, v) {
    let inside = false;
    for (let i = 0, j = v.length - 1; i < v.length; j = i++) {
      const a = v[i], b = v[j];
      if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  }
  function obstacleCorners(o) {
    const c = Math.cos(o.rot || 0), s = Math.sin(o.rot || 0), w = o.w / 2, d = o.d / 2;
    return [[-w, -d], [w, -d], [w, d], [-w, d]].map(p => ({ x: o.x + p[0] * c - p[1] * s, y: o.y + p[0] * s + p[1] * c }));
  }

  class SharedRoom {
    constructor(desc) {
      this.desc = desc;
      const H = (this.height = Math.max(1.5, desc.height));
      let verts = desc.verts.map(v => ({ x: v.x, y: v.y, mat: v.mat }));
      if (signedArea(verts) < 0) {
        // keep each wall's material attached to the wall when the winding flips
        const n = verts.length, r = [];
        for (let i = 0; i < n; i++) r.push({ x: verts[(n - i) % n].x, y: verts[(n - i) % n].y, mat: verts[(2 * n - i - 1) % n].mat });
        verts = r;
      }
      this.verts = verts;
      this.surfaces = [];
      this.blockers = [];
      this.obstacles = [];
      const refl = m => matOf(m).a.map(a => Math.sqrt(1 - a));

      verts.forEach((p, i) => {
        const q = verts[(i + 1) % verts.length];
        const ex = q.x - p.x, ey = q.y - p.y, len = Math.hypot(ex, ey) || 1;
        const nx = -ey / len, ny = ex / len;
        const s = { kind: 'wall', px: p.x, py: p.y, qx: q.x, qy: q.y, ex, ey, len, nx, ny, nz: 0, d: nx * p.x + ny * p.y, zmax: H, R: refl(p.mat), obs: -1 };
        this.surfaces.push(s);
        this.blockers.push(s);
      });
      this.surfaces.push({ kind: 'floor', nx: 0, ny: 0, nz: 1, d: 0, R: refl(desc.floor), obs: -1 });
      this.surfaces.push({ kind: 'ceil', nx: 0, ny: 0, nz: -1, d: -H, R: refl(desc.ceiling), obs: -1 });

      (desc.obstacles || []).forEach((o, oi) => {
        const cs = obstacleCorners(o), h = Math.min(o.h, H);
        this.obstacles.push({ corners: cs, h, desc: o });
        // corners run counter-clockwise, so the right-hand normal faces outward
        cs.forEach((p, i) => {
          const q = cs[(i + 1) % 4];
          const ex = q.x - p.x, ey = q.y - p.y, len = Math.hypot(ex, ey) || 1;
          const nx = ey / len, ny = -ex / len;
          const s = { kind: 'obs', px: p.x, py: p.y, qx: q.x, qy: q.y, ex, ey, len, nx, ny, nz: 0, d: nx * p.x + ny * p.y, zmax: h, R: refl(o.mat), obs: oi };
          this.surfaces.push(s);
          this.blockers.push(s);
        });
      });
      this.surfaces.forEach((s, i) => (s.id = i));
      this.stats = analyzeRoom(desc);
    }

    inPlan(x, y) { return pointInPoly(x, y, this.verts); }

    /* Parameter along segment a->b where it crosses vertical surface s, or -1 */
    hit(ax, ay, az, bx, by, bz, s) {
      const dx = bx - ax, dy = by - ay;
      const den = dx * s.ey - dy * s.ex;
      if (den > -1e-10 && den < 1e-10) return -1;
      const rx = s.px - ax, ry = s.py - ay;
      const t = (rx * s.ey - ry * s.ex) / den;
      if (t <= 1e-4 || t >= 0.9999) return -1;
      const u = (rx * dy - ry * dx) / den;
      if (u < 0 || u > 1) return -1;
      if (az + t * (bz - az) > s.zmax) return -1;
      return t;
    }

    blocked(ax, ay, az, bx, by, bz, skipA, skipB) {
      const list = this.blockers;
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        if (s.id === skipA || s.id === skipB) continue;
        if (this.hit(ax, ay, az, bx, by, bz, s) >= 0) return true;
      }
      return false;
    }

    /* Extra path length needed to get around whatever blocks a->b. It reaches
       zero exactly as the line of sight opens, so occlusion never clicks. */
    detour(a, b) {
      const direct = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
      let wall = 0, obstacle = 0;
      const seen = new Set();
      const via = (x, y, z) => Math.hypot(x - a.x, y - a.y, z - a.z) + Math.hypot(x - b.x, y - b.y, z - b.z) - direct;
      for (const s of this.blockers) {
        const t = this.hit(a.x, a.y, a.z, b.x, b.y, b.z, s);
        if (t < 0) continue;
        const z = a.z + t * (b.z - a.z);
        if (s.kind === 'wall') {
          wall = Math.max(wall, Math.min(via(s.px, s.py, z), via(s.qx, s.qy, z)));
        } else if (!seen.has(s.obs)) {
          seen.add(s.obs);
          const o = this.obstacles[s.obs];
          let best = via(a.x + t * (b.x - a.x), a.y + t * (b.y - a.y), o.h);
          for (const c of o.corners) best = Math.min(best, via(c.x, c.y, z));
          obstacle += Math.max(0, best);
        }
      }
      return wall + obstacle;
    }

    onSurface(s, x, y, z) {
      if (s.kind === 'floor' || s.kind === 'ceil') return pointInPoly(x, y, this.verts);
      const u = ((x - s.px) * s.ex + (y - s.py) * s.ey) / (s.len * s.len);
      return u >= 0 && u <= 1 && z >= 0 && z <= s.zmax;
    }

    /* Image-source search through the custom room. Returns audible specular paths. */
    findReflections(S, L, order, out) {
      out.length = 0;
      const surfaces = this.surfaces, self = this;
      const chain = [], images = [];
      let budget = 5000;

      function trace(depth) {
        const pts = [];
        let tx = L.x, ty = L.y, tz = L.z, prev = -1;
        let gl = 1, gm = 1, gh = 1;
        for (let j = depth - 1; j >= 0; j--) {
          const s = surfaces[chain[j]], I = images[j];
          const dx = I.x - tx, dy = I.y - ty, dz = I.z - tz;
          const den = s.nx * dx + s.ny * dy + s.nz * dz;
          if (den > -1e-9 && den < 1e-9) return;
          const t = (s.d - (s.nx * tx + s.ny * ty + s.nz * tz)) / den;
          if (t <= 1e-4 || t >= 0.9999) return;
          const px = tx + t * dx, py = ty + t * dy, pz = tz + t * dz;
          if (!self.onSurface(s, px, py, pz)) return;
          if (self.blocked(tx, ty, tz, px, py, pz, prev, s.id)) return;
          pts.push(px, py, pz);
          gl *= s.R[0]; gm *= s.R[1]; gh *= s.R[2];
          tx = px; ty = py; tz = pz; prev = s.id;
        }
        if (self.blocked(tx, ty, tz, S.x, S.y, S.z, prev, -1)) return;
        const I = images[depth - 1];
        const dist = Math.hypot(I.x - L.x, I.y - L.y, I.z - L.z);
        let key = 0;
        for (let j = 0; j < depth; j++) key = key * 64 + chain[j] + 1;
        out.push({ key, dist, gl, gm, gh, order: depth, ax: pts[0], ay: pts[1], az: pts[2], pts, rank: gm / Math.max(dist, 0.3) });
      }

      function descend(depth, from) {
        for (let i = 0; i < surfaces.length; i++) {
          if (depth > 0 && chain[depth - 1] === i) continue;
          if (--budget < 0) return;
          const s = surfaces[i];
          const side = s.nx * from.x + s.ny * from.y + s.nz * from.z - s.d;
          if (side <= 0) continue;
          if (s.nx * L.x + s.ny * L.y + s.nz * L.z - s.d <= 0 && depth + 1 === order) continue;
          const img = { x: from.x - 2 * side * s.nx, y: from.y - 2 * side * s.ny, z: from.z - 2 * side * s.nz };
          chain[depth] = i;
          images[depth] = img;
          trace(depth + 1);
          if (depth + 1 < order) descend(depth + 1, img);
        }
      }
      descend(0, S);
      return out;
    }
  }

  /* Volume, surface area and Eyring decay time for each band */
  function analyzeRoom(desc) {
    const H = Math.max(1.5, desc.height), v = desc.verts;
    const planArea = Math.abs(signedArea(v));
    let perim = 0;
    const absorb = [0, 0, 0];
    const add = (mat, area) => matOf(mat).a.forEach((a, b) => (absorb[b] += area * a));
    v.forEach((p, i) => {
      const q = v[(i + 1) % v.length], len = Math.hypot(q.x - p.x, q.y - p.y);
      perim += len;
      add(p.mat, len * H);
    });
    add(desc.floor, planArea);
    add(desc.ceiling, planArea);
    let volume = planArea * H, surface = 2 * planArea + perim * H;
    (desc.obstacles || []).forEach(o => {
      const h = Math.min(o.h, H);
      volume -= o.w * o.d * h;
      const area = 2 * (o.w + o.d) * h;
      surface += area;
      add(o.mat, area);
    });
    volume = Math.max(1, volume);
    const scale = desc.decay == null ? 1 : desc.decay;
    const rt = absorb.map((A, b) => {

/* ------------------------------------------------------------------ timeline */
const tl = { c: $('timeline'), drag: null, left: 86, ruler: 22, lane: 24 };
function layoutTimeline() { tl.c.style.height = tl.ruler + tl.lane * scene.tracks.length + 4 + 'px'; dirty = true; }

tl.c.addEventListener('pointerdown', e => {
